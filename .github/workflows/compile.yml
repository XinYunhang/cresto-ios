name: Compile check

# 不需要任何 secret，也不需要签名：只验证能不能编译过。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Write local profile
        env:
          BIRTHDAY_SECRET: ${{ secrets.BIRTHDAY }}
          NAME_SECRET: ${{ secrets.NAME }}
        run: |
          if [ -n "${BIRTHDAY_SECRET:-}" ]; then
            bash scripts/make_profile.sh "$BIRTHDAY_SECRET" "${NAME_SECRET:-}"
          else
            echo "no BIRTHDAY secret, falling back to neutral birthday"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write course data
        env:
          COURSES_JSON_B64: ${{ secrets.COURSES_JSON }}
        run: |
          if [ -n "${COURSES_JSON_B64:-}" ]; then
            echo "$COURSES_JSON_B64" | base64 --decode > Cresto/Resources/courses.json
            echo "courses.json written"
          else
            echo "no COURSES_JSON secret, timetable will start empty"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (simulator, no codesign)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cresto.xcodeproj \
            -scheme Cresto \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
